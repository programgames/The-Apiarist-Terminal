name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle and Forge/MCP
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-fg2_3-forge-1_12_2-14_23_5_2847-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-fg2_3-forge-1_12_2-14_23_5_2847-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        working-directory: .
        run: |
          ./gradlew --version
          ./gradlew setupCiWorkspace --no-daemon --info
          ./gradlew test --no-daemon --info
          ./gradlew build --no-daemon --info

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oc-gendustry-jar
          path: build/libs/*.jar

      - name: Publish GitHub Release (tags only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG")
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          git show "$TAG_COMMIT:CHANGELOG.md" > /tmp/RELEASE_CHANGELOG 2>/dev/null || true
          # Prefer only the section for this tag from CHANGELOG.md
          VERSION_CORE=$(echo "$TAG" | sed -E 's/^v//; s/^([0-9]+(\.[0-9]+)*).*/\1/')
          if [ -s /tmp/RELEASE_CHANGELOG ]; then
            EXTRACTED=$(awk -v ver="$VERSION_CORE" '
              BEGIN{found=0}
              $0 ~ "^##[[:space:]]*\\[" ver "\\]" {found=1; print; next}
              found && $0 ~ "^##[[:space:]]*\\[" {exit}
              found {print}
            ' /tmp/RELEASE_CHANGELOG)
          fi
          if [ -s /tmp/RELEASE_CHANGELOG ]; then
            if [ -n "$EXTRACTED" ]; then
              CHANGELOG_CONTENT="$EXTRACTED"
            else
              CHANGELOG_CONTENT=$(cat /tmp/RELEASE_CHANGELOG)
            fi
            if [ -n "$TAG_MESSAGE" ]; then
              RELEASE_NOTES="$TAG_MESSAGE\n\n$CHANGELOG_CONTENT"
            else
              RELEASE_NOTES="$CHANGELOG_CONTENT"
            fi
          else
            if [ -n "$TAG_MESSAGE" ]; then
              RELEASE_NOTES="$TAG_MESSAGE"
            else
              RELEASE_NOTES="The Apiarist Terminal $TAG"
            fi
          fi
          gh release create "$TAG" build/libs/*.jar \
            --title "The Apiarist Terminal $TAG" \
            --notes "$RELEASE_NOTES" \
            $(if [[ "$TAG" =~ [ab]|rc|pre ]]; then echo "--prerelease"; fi)

      - name: Publish to CurseForge (tags only; infer release type)
        if: ${{ env.CURSEFORGE_TOKEN != '' && startsWith(github.ref, 'refs/tags/') }}
        working-directory: .
        env:
          CURSEFORGE_TOKEN: ${{ env.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ env.CURSEFORGE_PROJECT_ID }}
          GIT_TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          TAG="${GIT_TAG:-${GITHUB_REF##*/}}"
          LOWER=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
          RELEASE_TYPE=release
          # Keyword-based detection works regardless of separators
          if [[ "$LOWER" == *alpha* ]]; then
            RELEASE_TYPE=alpha
          elif [[ "$LOWER" == *beta* || "$LOWER" == *rc* || "$LOWER" == *pre* ]]; then
            RELEASE_TYPE=beta
          else
            # Suffix-based detection: v0.1.1a / v0.1.1b (no dashes)
            CORE=$(echo "$LOWER" | sed -E 's/^v//')
            if [[ "$CORE" =~ ^[0-9]+(\.[0-9]+)*a([0-9]*)?$ ]]; then
              RELEASE_TYPE=alpha
            elif [[ "$CORE" =~ ^[0-9]+(\.[0-9]+)*b([0-9]*)?$ ]]; then
              RELEASE_TYPE=beta
            fi
          fi
          # Try to get annotated tag message, fallback to commit message
          TAG_MESSAGE=$(git tag -l --format='%(contents)' "$TAG")
          TAG_COMMIT=$(git rev-list -n 1 "$TAG")
          git show "$TAG_COMMIT:CHANGELOG.md" > /tmp/RELEASE_CHANGELOG 2>/dev/null || true
          VERSION_CORE=$(echo "$TAG" | sed -E 's/^v//; s/^([0-9]+(\.[0-9]+)*).*/\1/')
          if [ -s /tmp/RELEASE_CHANGELOG ]; then
            EXTRACTED=$(awk -v ver="$VERSION_CORE" '
              BEGIN{found=0}
              $0 ~ "^##[[:space:]]*\\[" ver "\\]" {found=1; print; next}
              found && $0 ~ "^##[[:space:]]*\\[" {exit}
              found {print}
            ' /tmp/RELEASE_CHANGELOG)
          fi
          if [ -s /tmp/RELEASE_CHANGELOG ]; then
            if [ -n "$EXTRACTED" ]; then
              CHANGELOG_CONTENT="$EXTRACTED"
            else
              CHANGELOG_CONTENT=$(cat /tmp/RELEASE_CHANGELOG)
            fi
            if [ -n "$TAG_MESSAGE" ]; then
              CL="$TAG_MESSAGE\n\n$CHANGELOG_CONTENT"
            else
              CL="$CHANGELOG_CONTENT"
            fi
          else
            if [ -n "$TAG_MESSAGE" ]; then
              CL="$TAG_MESSAGE"
            else
              CL=${CHANGELOG:-"Release $TAG"}
            fi
          fi

          ./gradlew curseforge --no-daemon \
            -PcurseforgeProjectId="$CURSEFORGE_PROJECT_ID" \
            -PcurseforgeChangelog="$CL" \
            -PcurseforgeReleaseType="$RELEASE_TYPE"
