buildscript {
    repositories {
        jcenter()
        // Legacy ForgeGradle 2.3 requires the old maven; keep both for reliability.
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.cil.li/' } // OpenComputers
        mavenCentral()
        maven { url = 'https://plugins.gradle.org/m2/' } // CurseGradle plugin
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
        classpath 'gradle.plugin.com.matthewprenger:CurseGradle:1.4.0'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'
apply plugin: 'java'
apply plugin: 'com.matthewprenger.cursegradle'

version = '0.2.0'
group = 'net.ocgendustry'
archivesBaseName = 'apiarist-terminal'

sourceCompatibility = 1.8
targetCompatibility = 1.8


minecraft {
    version = "1.12.2-14.23.5.2847"
    // A client and a server started together fight over logs/latest.log if they share a
    // directory, and ForgeGradle gives both run tasks the same one. Pass -PmcRunDir=run-server to
    // the server so each gets its own -- the shared "Minecraft Server" run configuration carries
    // that flag. Setting workingDir on the task instead does not work: ForgeGradle assigns it in a
    // doFirst, at execution time, and overwrites anything configured earlier. A server started
    // without the flag generates a second, empty world in run/ and looks like the first one was
    // lost.
    runDir = project.findProperty('mcRunDir') ?: 'run'
    mappings = "stable_39"
}

repositories {
    // CurseMaven lets us download CF-hosted jars via projectId/fileId
    maven { url = 'https://cursemaven.com' }
    // Forestry artifacts are hosted on ModMaven
    maven { url = 'https://modmaven.dev' }
    mavenCentral()
    // IndustrialCraft 2 API
    maven { url = 'https://maven.ic2.player.to/' }
    // CoFH / RedstoneFlux API (hosted on covers1624 maven)
    maven { url = 'https://maven.covers1624.net/' }
    // Fallback for local deobf jars of Gendustry/bdlib placed under libs/
    flatDir { dirs 'libs' }
}

dependencies {
    // Compile against the OpenComputers mod itself, deobfuscated, not against the API jar.
    //
    // The API published on maven.cil.li stops at 1.7.5.x while the mod anyone actually runs is
    // 1.8.7, and the two differ: TextBuffer.fill(IIIII) exists only in the newer one. Whenever the
    // old API reached the run classpath it shadowed the installed mod's own li.cil.oc.api classes
    // and the server crashed the moment a screen was drawn. compileOnly kept it off that classpath
    // under Gradle -- but IntelliJ maps compileOnly to Provided scope and puts it back, so the
    // crash returned when launching from the IDE.
    //
    // deobfCompile on the mod removes the mismatch instead of hiding it: one version, compiled and
    // run against the same classes, in both launch paths. It also means the mod must not be copied
    // into run/mods -- see setupDevMods below.
    deobfCompile "curse.maven:opencomputers-223008:6057571"

    // Naming a Gendustry tile in a test loads that class, and it implements the RF and IC2
    // energy interfaces. Both are compileOnly for the mod itself; the tests need them on
    // their own runtime classpath or the class fails to define.
    testCompile 'net.industrial-craft:industrialcraft-2:2.8.170-ex112:api'

    // Prefer automatic download + deobf from CurseMaven if IDs are provided in gradle.properties
    if (project.hasProperty('gendustryProjectId') && project.hasProperty('gendustryFileId') && gendustryProjectId && gendustryFileId) {
        deobfCompile "curse.maven:gendustry-${gendustryProjectId}:${gendustryFileId}"
    } else {
        // Fallback to local deobf jar
        compileOnly files('libs/gendustry-deobf.jar')
    }

    if (project.hasProperty('bdlibProjectId') && project.hasProperty('bdlibFileId') && bdlibProjectId && bdlibFileId) {
        deobfCompile "curse.maven:bdlib-${bdlibProjectId}:${bdlibFileId}"
    } else {
        // Fallback to local deobf jar
        compileOnly files('libs/bdlib-deobf.jar')
    }

    // Provided by the game at runtime
    provided 'net.minecraft:launchwrapper:1.12'

    // APIs required by Gendustry's tile classes during compilation
    compileOnly 'net.industrial-craft:industrialcraft-2:2.8.170-ex112:api'
    // deobfCompile, not compileOnly: this is a full mod jar, not just an API, and it has to
    // be on the run classpath deobfuscated. IntelliJ puts compileOnly dependencies on the
    // classpath anyway (it maps them to Provided scope), so a second copy under run/mods
    // made FML refuse to start on a duplicate mod id -- the same rule as Gendustry, bdlib
    // and Forestry: a mod on the classpath never goes in run/mods too.
    deobfCompile 'cofh:RedstoneFlux:1.12-2.1.0.6:universal'

    // Forestry (API is packaged in main jar for 1.12.2); needed for interfaces like IBeekeepingLogic/IErrorLogic
    deobfCompile 'net.sengir.forestry:forestry_1.12.2:5.8.2.422'

    // Test deps (pure unit tests only; no MC bootstrap)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes(
            'FMLAT': 'ocgendustry_at.cfg'
        )
    }
}

// Helper: print which dependency sources will be used
task printDeps {
    group = 'help'
    description = 'Prints which dependency path will be used for Gendustry/bdlib and shows current CurseMaven properties.'
    doLast {
        def gProj = project.hasProperty('gendustryProjectId') ? project.property('gendustryProjectId') : ''
        def gFile = project.hasProperty('gendustryFileId') ? project.property('gendustryFileId') : ''
        def bProj = project.hasProperty('bdlibProjectId') ? project.property('bdlibProjectId') : ''
        def bFile = project.hasProperty('bdlibFileId') ? project.property('bdlibFileId') : ''

        println '--- Dependency resolution overview ---'
        println "Gendustry: projectId='${gProj}', fileId='${gFile}'"
        if (gProj && gFile) {
            println " -> Using CurseMaven: curse.maven:gendustry-${gProj}:${gFile} (deobfCompile)"
        } else {
            println " -> Using local fallback: libs/gendustry-deobf.jar (compileOnly)"
        }

        println "bdlib:     projectId='${bProj}', fileId='${bFile}'"
        if (bProj && bFile) {
            println " -> Using CurseMaven: curse.maven:bdlib-${bProj}:${bFile} (deobfCompile)"
        } else {
            println " -> Using local fallback: libs/bdlib-deobf.jar (compileOnly)"
        }

        if ((gProj && !gFile) || (!gProj && gFile)) {
            println 'WARN: Gendustry has a partial property set; provide BOTH projectId and fileId to use CurseMaven.'
        }
        if ((bProj && !bFile) || (!bProj && bFile)) {
            println 'WARN: bdlib has a partial property set; provide BOTH projectId and fileId to use CurseMaven.'
        }
    }
}

// CurseForge publishing configuration (runs with gradle curseforge)
// Apply only if a project id is provided to avoid configuration errors during normal builds.
if ((project.findProperty('curseforgeProjectId') ?: System.getenv('CURSEFORGE_PROJECT_ID'))?.toString()?.trim()) {
    def cfId = (project.findProperty('curseforgeProjectId') ?: System.getenv('CURSEFORGE_PROJECT_ID')).toString().trim()
    curseforge {
        apiKey = System.getenv('CURSEFORGE_TOKEN') ?: (project.hasProperty('curseforgeApiKey') ? project.property('curseforgeApiKey') : '')
        project {
            id = cfId
            releaseType = project.findProperty('curseforgeReleaseType') ?: 'release'
            changelog = project.findProperty('curseforgeChangelog') ?: 'Automated build'
            changelogType = 'markdown'
            addGameVersion '1.12.2'
            addGameVersion 'Java 8'

            mainArtifact(jar) {
                displayName = "The Apiarist Terminal ${project.version}"
                relations {
                    requiredDependency 'opencomputers'
                    requiredDependency 'gendustry'
                    requiredDependency 'bdlib'
                }
            }
        }
    }
}

// --- Local test environment --------------------------------------------------------------------
// The mods a dev client needs to exercise this one: the bee mods Gendustry builds on, a creative
// power source, and JEI to find any of it in a creative inventory nobody can navigate by hand. They are downloaded from CurseMaven and copied into the run
// directories, never committed -- redistributing someone else's jar is not ours to do.
//
// OpenComputers, Gendustry, bdlib and Forestry are absent on purpose: the build already puts
// them on the classpath, and a second copy in run/mods makes FML refuse to start on a
// duplicate mod id.
//
//   .\gradlew.bat setupDevMods     downloads them and fills run/mods and run-server/mods
configurations {
    devMods
}

dependencies {
    devMods "curse.maven:jei-238222:8752694"                    // Just Enough Items
    devMods "curse.maven:extra-utilities-225561:2678374"        // Creative Energy Source
    devMods "curse.maven:binnies-mods-223525:2916129"           // Binnie's: Extra Bees, Genetics
    devMods "curse.maven:codechicken-lib-1-8-242818:2779848"    // required by Thermal Expansion
    devMods "curse.maven:cofh-core-69162:2920433"
    devMods "curse.maven:cofh-world-271384:2920434"
    devMods "curse.maven:thermal-foundation-222880:2926428"
    devMods "curse.maven:thermal-expansion-69163:2926431"       // Creative Energy Cell
}

// The reference Lua programs, delivered into a dev world as an OpenComputers floppy.
//
// OpenComputers scans <world>/opencomputers/loot/ when the world loads: loot.properties maps a
// folder to a disk label, weight and dye colour, and the folder becomes the disk's filesystem.
// The weight is the chance of the disk turning up in a dungeon chest; it is set to 1 rather than
// 0 only because a weight-0 disk is registered through a narrower path, and a dev world is not
// somewhere anyone minds finding it. Laying the files out under usr/ means OpenOS's `install` copies
// them to /usr, where /usr/lib is already on package.path -- so require("apiarist") just works.
//
// This is the only route that needs nothing of the computer: no hard drive, no internet card, no
// guessing at the address of a managed filesystem that OpenComputers only creates on first write.
// The world has to be reloaded afterwards, since the scan happens on WorldEvent.Load.
//
//   .\gradlew.bat setupDevDisk    writes the disk into run/ and run-server/
task setupDevDisk {
    group = 'apiarist'
    description = 'Installs the reference Lua programs as an OpenComputers loot floppy in both dev worlds'

    doLast {
        def scripts = file('src/main/resources/ocgendustry/scripts')
        // The library is required by name; everything else is run by name. OpenOS puts /usr/lib on
        // package.path and /usr/bin on the shell's PATH, so the split decides how each is reached.
        def library = 'apiarist.lua'

        // run/ is a client save, whose name the player chose; run-server/ always uses world/.
        def worlds = []
        file('run/saves').listFiles()?.each { if (it.directory) worlds << it }
        worlds << file('run-server/world')

        worlds.each { world ->
            def disk = new File(world, 'opencomputers/loot/apiarist')
            delete disk
            copy {
                from(scripts) { include library; into 'usr/lib' }
                from(scripts) { exclude library; into 'usr/bin' }
                into disk
            }
            new File(disk, '.prop').text = '{label="Apiarist Terminal"}\n'

            def descriptor = new File(world, 'opencomputers/loot/loot.properties')
            descriptor.parentFile.mkdirs()
            descriptor.text = "# Written by ./gradlew setupDevDisk -- do not edit by hand.\n" +
                "apiarist=Apiarist Terminal (Gendustry):1:dyeYellow\n"

            logger.lifecycle("Apiarist disk -> ${disk}")
        }
    }
}

task setupDevMods {
    group = 'apiarist'
    description = 'Downloads the third-party mods a dev client and server need, into run/ and run-server/'

    doLast {
        ['run/mods', 'run-server/mods'].each { dir ->
            // Wipe first: a jar left over from a previous version, or copied in by hand, makes FML
            // refuse to start on a duplicate mod id.
            delete fileTree(dir) { include '*.jar' }
            copy {
                from configurations.devMods
                into file(dir)
            }
        }

        // The dedicated server refuses to start until the EULA is accepted, and a fresh dev server
        // with no properties file generates a survival world with online-mode on, which a dev
        // client cannot join.
        def serverDir = file('run-server')
        serverDir.mkdirs()
        def eula = new File(serverDir, 'eula.txt')
        if (!eula.exists()) eula.text = "eula=true" + System.lineSeparator()

        def props = new File(serverDir, 'server.properties')
        if (!props.exists()) {
            props.text = """online-mode=false
gamemode=1
force-gamemode=true
level-type=FLAT
generate-structures=false
spawn-monsters=false
difficulty=0
allow-flight=true
spawn-protection=0
view-distance=6
motd=Apiarist Terminal - dev server
# Minecraft's default. The watchdog kills the server when a tick exceeds it, which is exactly
# what a callback that blocks the server thread will trigger.
max-tick-time=60000
"""
        }

        logger.lifecycle("run/mods and run-server/mods ready: ${configurations.devMods.files.size()} mods")
    }
}

// ForgeGradle 2.3 predates Gradle 4's build/classes/java/<sourceSet> layout. It means to swap the
// main source set's classes directory for the built jar on the run classpath, but under Gradle
// 4.10 it looks for the old build/classes/main, finds nothing to remove, and leaves the jar in
// place of a directory that is still missing. The result is a dev launch with no mod in it: FML
// reports the 23 third-party mods and not ours, no error, and every component the drivers should
// register is simply absent -- `survey` answered "13 components, 0 Gendustry".
//
// The jar it substitutes could not have worked anyway: `build` reobfuscates it in place, so its
// Minecraft calls are SRG names (func_77978_p) while a dev launch runs on MCP names.
//
// Putting sourceSets.main.output back is the whole fix, and it covers both launch paths at once:
// IntelliJ derives the module's dependencies from this same runtime classpath.
afterEvaluate {
    def modClasses = sourceSets.main.output
    def reobfJar = jar.archivePath

    sourceSets.main.runtimeClasspath += modClasses

    tasks.withType(JavaExec).matching { it.name in ['runClient', 'runServer'] }.each { run ->
        run.classpath = run.classpath.filter { it != reobfJar } + modClasses
        // The run tasks inherited a dependency on `jar`, not on the classes: without this a launch
        // after `clean` finds an empty directory and silently starts without the mod again.
        run.dependsOn 'classes'
    }

    // A client and a dedicated server cannot share a save directory, and ForgeGradle hands both run
    // tasks the same runDir. It assigns workingDir from it in a doFirst, at execution time, so
    // configuring the task is not enough -- and forgetting the -PmcRunDir flag is not a small
    // mistake: the server silently generates a second, empty world in run/ and joining it looks
    // exactly like having lost a base.
    //
    // Hence an action inserted at the end of the action list rather than a doFirst, which would
    // prepend and run before ForgeGradle's. Everything before the task's own exec has run by then,
    // so this is the last word on where the server writes, flag or no flag.
    def runServer = tasks.runServer
    runServer.actions.add(runServer.actions.size() - 1, { task ->
        def serverDir = task.project.file('run-server')
        serverDir.mkdirs()
        task.workingDir = serverDir
        task.logger.lifecycle("server world: ${serverDir}")
    } as Action)

}

task cpCheck {
    group = 'apiarist'
    description = 'Prints where the run tasks will look for the mod, and whether the classes are there'

    doLast {
        ['runClient', 'runServer'].each { name ->
            def own = tasks[name].classpath.files.findAll { it.path.contains(projectDir.name) }
            println "-- ${name}:"
            own.each { println "     ${it}" }
        }
        println "-- sourceSets.main.runtimeClasspath (ce que IntelliJ importe):"
        sourceSets.main.runtimeClasspath.files.each {
            if (it.path.contains(projectDir.name)) println "     ${it}"
        }
    }
}
