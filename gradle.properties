# Gradle properties for automatic dependency download (CurseMaven)
# Provide these IDs to let the build download and deobfuscate Gendustry/bdlib automatically.
# If left empty, the build falls back to libs/gendustry-deobf.jar and libs/bdlib-deobf.jar.
# Find these on the CurseForge project/file page URLs or via the CurseForge API.

# Gendustry (CurseForge)
gendustryProjectId=70492
gendustryFileId=2516215

# bdlib (CurseForge)
bdlibProjectId=70496
bdlibFileId=4675629

# Ensure TLS 1.2 + SNI on older JDK8, and consistent encoding/memory
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2 -Djsse.enableSNIExtension=true
systemProp.https.protocols=TLSv1.2
org.gradle.daemon=false
