apply from: 'gradle/scripts/helpers.gradle'

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    mavenLocal() // Must be last for caching to work
}

/**
 * NOT DEPENDENCIES:
 *  - runtimeOnly: not required at all for the mod, added for developer convenience to run targets
 * OPTIONAL DEPENDENCIES:
 *  - compileOnly: will not be included in developer run targets
 *  - devOnlyNonPublishable: will be included in developer run targets
 * REQUIRED DEPENDENCIES:
 *  - implementation: mods or other jars that are required to be installed alongside this mod
 */
dependencies {
    // Include StripLatestForgeRequirements by default for the dev env
    runtimeOnly 'com.cleanroommc:strip-latest-forge-requirements:1.0'
    // Include OSXNarratorBlocker by default for the dev env, for M1+ Macs
    runtimeOnly 'com.cleanroommc:osxnarratorblocker:1.0'

    // ---- Required dependencies ----

    // OpenComputers
    implementation rfg.deobf("curse.maven:opencomputers-223008:8582726")

    // Gendustry
    implementation rfg.deobf("curse.maven:gendustry-70492:2516215")
    // BDLib
    devOnlyNonPublishable rfg.deobf("curse.maven:bdlib-70496:4675629")
    // Forestry
    devOnlyNonPublishable rfg.deobf("curse.maven:forestry-59751:7398359")
    // Redstone Flux
    devOnlyNonPublishable rfg.deobf("curse.maven:redstoneflux-270789:2920436")
    // IC2 API
    devOnlyNonPublishable rfg.deobf("curse.maven:industrialcraft-242638:3838713")
}